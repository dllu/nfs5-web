<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFS Porsche Unleashed · Web port</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./viewport.css" media="not all" id="viewport-style">
<main>
  <p class="eyebrow">NFS5 / WEBASSEMBLY</p>
  <h1>Porsche Unleashed</h1>
  <p class="intro">Bringing the original PC game to the browser.</p>
  <section aria-labelledby="runtime-title">
    <h2 id="runtime-title">Runtime bring-up</h2>
    <p>The original intro plays with sound. Menus and racing are still being ported.</p>
    <button id="play" type="button">Run game</button>
    <button id="stop" type="button" hidden>Stop</button>
    <button id="boot" type="button">Run original startup</button>
    <p id="status" role="status">Ready to load the local game build.</p>
    <canvas id="game" width="640" height="480" hidden aria-label="Game output"></canvas>
    <pre id="output" aria-label="Execution diagnostics" tabindex="0"></pre>
  </section>
</main>
<script type="module" src="./app.mjs"></script>
</html>
